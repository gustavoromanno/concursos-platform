name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-24.04   # fixo: o ubuntu-latest passa a ser o 26 em 19/10/2026
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v5

      - name: Instalar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Instalar Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verificar o frontend
        run: |
          npm install --no-save --no-package-lock jsdom@24
          node scripts/verificar-frontend.js

      - name: Rodar os testes
        run: mvn -B test
