# TEMPORARIO (branch spring-boot-4): testes + subida real da aplicacao num PostgreSQL,
# com o resumo publicado como anotacao (legivel pela API). Apagar antes do merge.
name: Migracao Spring Boot 4

on:
  push:
    branches: [spring-boot-4]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Rodar os testes
        run: mvn -B test 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Total de testes
        if: success()
        run: echo "::notice title=testes::$(grep -E 'Tests run:' build.log | tail -1)"
      - name: Resumo dos erros
        if: failure()
        run: |
          grep -E "\[ERROR\]|Tests run:.*(Failures: [1-9]|Errors: [1-9])|Caused by|Exception:|expected|but was" build.log \
            | grep -vE "Help 1|re-run Maven|full stack trace|-> \[Help|For more information|^\[ERROR\] *$|-e switch|-X switch" \
            | awk '!seen[$0]++' | head -150 > resumo.txt
          echo "::error title=resumo::$(sed -e 's/%/%25/g' resumo.txt | awk '{printf "%s%%0A", $0}' | cut -c1-60000)"

  subida:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: concursos
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Empacotar
        run: mvn -B -q -DskipTests package
      - name: Subir a aplicacao (Flyway + validacao do Hibernate)
        env:
          DB_URL: jdbc:postgresql://localhost:5432/concursos
          JWT_SECRET: segredo-so-para-o-teste-de-subida-com-mais-de-32-caracteres
        run: |
          java -jar target/concursos-platform-0.1.0.jar > app.log 2>&1 &
          for i in $(seq 1 90); do curl -sf localhost:8080/health > health.txt && break; sleep 2; done
          test -s health.txt
      - name: Conferir
        run: |
          {
            echo "health: $(cat health.txt)"
            echo "migracoes aplicadas: $(PGPASSWORD=postgres psql -h localhost -U postgres -d concursos -Atc 'select count(*) || '' (ultima V'' || max(installed_rank) || '': '' || (select version from flyway_schema_history order by installed_rank desc limit 1) || '')'' from flyway_schema_history where success')"
            echo "questoes: $(PGPASSWORD=postgres psql -h localhost -U postgres -d concursos -Atc 'select count(*) from questao')"
            echo "resumos de teoria: $(PGPASSWORD=postgres psql -h localhost -U postgres -d concursos -Atc 'select count(*) from resumo_assunto')"
            echo "GET /planos: $(curl -s -o /dev/null -w '%{http_code}' localhost:8080/planos) $(curl -s localhost:8080/planos | head -c 300)"
            echo "GET /publico/numeros: $(curl -s localhost:8080/publico/numeros | head -c 200)"
            echo "GET /: $(curl -s -o /dev/null -w '%{http_code}' localhost:8080/)"
            echo "GET /questoes sem login: $(curl -s -o /dev/null -w '%{http_code}' localhost:8080/questoes)"
            echo "POST /auth/login invalido: $(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"email":"x@x.com","senha":"errada"}' localhost:8080/auth/login)"
            echo "versao do Spring Boot: $(grep -o 'Spring Boot ::.*\|v4\.[0-9.]*' app.log | head -1)"
            grep -E "WARN|ERROR" app.log | head -20
          } > conferencia.txt
          echo "::notice title=subida::$(sed -e 's/%/%25/g' conferencia.txt | awk '{printf "%s%%0A", $0}' | cut -c1-60000)"
      - name: Log da aplicacao
        if: failure()
        run: echo "::error title=resumo::$(tail -80 app.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | cut -c1-60000)"
