# TEMPORARIO (branch spring-boot-4): roda os testes e publica o resumo dos erros
# como anotacao, que pode ser lida pela API. Apagar antes do merge na master.
name: Migracao Spring Boot 4

on:
  push:
    branches: [spring-boot-4]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Rodar os testes
        run: mvn -B test 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Resumo dos erros
        if: failure()
        run: |
          {
            grep -E "\[ERROR\]|Tests run:.*(Failures: [1-9]|Errors: [1-9])|Caused by|Exception:|expected|but was" build.log \
              | grep -vE "Help 1|re-run Maven|full stack trace|-> \[Help|For more information|^\[ERROR\] *$|-e switch|-X switch" \
              | awk '!seen[$0]++' | head -150
          } > resumo.txt
          msg=$(sed -e 's/%/%25/g' resumo.txt | awk '{printf "%s%%0A", $0}' | cut -c1-60000)
          echo "::error title=resumo::${msg}"
