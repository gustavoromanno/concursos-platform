# Banco descartavel em memoria para os testes.
# Sobrescreve direto as propriedades do Spring, sem placeholders.
# Um banco por contexto do Spring: classes de teste com configuracoes
# diferentes nao apagam as tabelas umas das outras.
spring.datasource.url=jdbc:h2:mem:${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa

# Sem Flyway: o schema e gerado a partir das entidades.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

# jwt.secret nao e definido aqui de proposito: vale o fallback do
# application.properties principal, e nenhum segredo fica no repositorio.
