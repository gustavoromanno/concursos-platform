spring.application.name=concursos-platform

# Banco de dados - credenciais vem de variaveis de ambiente.
# Os valores depois dos ":" sao apenas fallback para ambiente local.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/concursos}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Pool enxuto: o plano gratuito do Neon limita conexoes simultaneas.
spring.datasource.hikari.maximum-pool-size=${DB_POOL:5}
# Sem conexao ociosa presa: fechada depois de 1 min parada, o Neon pode suspender o
# banco quando nao ha uso (o plano gratuito tem limite de horas de computacao). A
# primeira consulta depois disso so abre uma conexao nova.
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:0}
# 4 min: a conexao sobrevive a uma pausa na leitura (reabrir custa ~1 s entre o
# Render e o Neon), mas fecha antes dos 5 min em que o Neon suspende o banco.
spring.datasource.hikari.idle-timeout=240000

# JPA - o Flyway cuida do schema, nao o Hibernate
spring.jpa.hibernate.ddl-auto=validate
# Boot 4 usa o Jackson 3; mantem os padroes do Jackson 2 (mesmo JSON de antes na API).
spring.jackson.use-jackson2-defaults=true
spring.jpa.open-in-view=false

# SQL no log so em desenvolvimento: em producao polui e vaza dados.
spring.jpa.show-sql=${SQL_LOG:false}
spring.jpa.properties.hibernate.format_sql=${SQL_LOG:false}

# Agrupa o carregamento de associacoes LAZY em lotes (corrige N+1).
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT - segredo sempre por variavel de ambiente. Minimo de 32 caracteres.
jwt.secret=${JWT_SECRET:troque-este-segredo-por-um-valor-longo-e-aleatorio-em-producao}
jwt.expiration-ms=86400000

# A hospedagem informa a porta pela variavel PORT.
server.port=${PORT:8080}

# Compactacao das respostas: economiza banda e acelera o carregamento.
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript

# Mensagens de erro enxutas para nao expor detalhes internos.
server.error.include-stacktrace=never
server.error.include-message=always

# IA (importacao de provas). As chaves vem SEMPRE de variavel de ambiente.
# IA_PROVEDOR escolhe quem gera: "gemini" (Google) ou "anthropic" (Claude).
# Sem a chave do provedor escolhido o resto do site funciona; so a importacao falha com aviso.
ia.provedor=${IA_PROVEDOR:gemini}
ia.gemini.api-key=${GEMINI_API_KEY:}
ia.gemini.modelo=${GEMINI_MODELO:gemini-3.8-flash}
# Usado quando o principal fica sobrecarregado (erro 503). Vazio desliga.
ia.gemini.modelo-reserva=${GEMINI_MODELO_RESERVA:gemini-3.6-flash}
ia.anthropic.api-key=${ANTHROPIC_API_KEY:}
ia.modelo=${IA_MODELO:claude-sonnet-5}

# Upload dos PDFs de prova e gabarito.
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=65MB

# Plano Pro (pre-pago) e Stripe. Chaves SEMPRE por variavel de ambiente.
app.url-base=${APP_URL_BASE:http://localhost:8080}
stripe.chave-secreta=${STRIPE_SECRET_KEY:}
stripe.segredo-webhook=${STRIPE_WEBHOOK_SECRET:}
# Formas de pagamento do checkout. Acrescente "pix" quando a Stripe liberar Pix na conta.
stripe.metodos=${STRIPE_METODOS:card,boleto}
# Precos em centavos.
pro.preco.mensal=${PRO_PRECO_MENSAL:2990}
pro.preco.trimestral=${PRO_PRECO_TRIMESTRAL:7990}
pro.preco.anual=${PRO_PRECO_ANUAL:23880}
# Assinatura mensal com renovacao automatica (cartao). Desligada ate configurar na
# Stripe a permissao "Subscriptions: Write" e os eventos invoice.* e customer.subscription.*.
pro.recorrente.ativo=${PRO_RECORRENTE_ATIVO:false}
pro.preco.recorrente=${PRO_PRECO_RECORRENTE:${PRO_PRECO_MENSAL:2990}}
pro.simulados-gratis-por-mes=${PRO_SIMULADOS_GRATIS:3}

# E-mail transacional (Resend). Remetente precisa ser de um dominio verificado no Resend.
email.resend.api-key=${RESEND_API_KEY:}
email.remetente=${EMAIL_REMETENTE:Romano Concursos <onboarding@resend.dev>}
# Para onde vao as respostas dos e-mails (caixa real de contato). Vazio = sem "Responder para".
email.responder-para=${EMAIL_RESPOSTA:}

# Nome da marca (site, e-mails, checkout). Trocar aqui ou em APP_NOME no Render.
app.nome=${APP_NOME:Romano Concursos}

# Cadastro so vale depois de confirmar o e-mail (exige o Resend configurado).
# Em desenvolvimento, sem Resend, use EXIGIR_CONFIRMACAO_EMAIL=false.
app.exigir-confirmacao-email=${EXIGIR_CONFIRMACAO_EMAIL:true}
