spring.application.name=concursos-platform

# Banco de dados - ajuste usuario/senha para o seu ambiente local
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA - deixamos o Flyway cuidar do schema, nao o Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=8080
