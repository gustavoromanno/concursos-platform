spring.application.name=concursos-platform

# Banco de dados - credenciais vem de variaveis de ambiente (Run Configuration do IntelliJ).
# Os valores depois dos ":" sao apenas fallback para ambiente local.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/concursos}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA - deixamos o Flyway cuidar do schema, nao o Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT - o segredo tambem vem de variavel de ambiente, nunca fica no codigo.
# Precisa ter no minimo 32 caracteres (exigencia do algoritmo HMAC-SHA256).
jwt.secret=${JWT_SECRET:troque-este-segredo-por-um-valor-longo-e-aleatorio-em-producao}
jwt.expiration-ms=86400000

server.port=8080
